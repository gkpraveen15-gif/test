name: Build and Push Docker Image

# This workflow is triggered ONLY when you push a Git tag starting with "v" (like v1.0.0)
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        # This uses secrets you configure in the GitHub repo settings
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags the Docker image with your Git tag (e.g. v1.1.0) AND 'latest'
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-de-pipeline:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/my-de-pipeline:latest
